<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="signGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00C49F"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Background building -->
  <rect width="1200" height="600" fill="url(#skyGrad)"/>
  
  <!-- Architectural framing -->
  <rect x="150" y="80" width="900" height="460" rx="16" fill="#111827" stroke="#334155" stroke-width="4"/>
  
  <!-- Shop Signboard -->
  <rect x="180" y="110" width="840" height="110" rx="12" fill="url(#signGrad)"/>
  <text x="600" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">MOBILE WORLD</text>
  <text x="600" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="5">SALES &amp; SERVICE • MULTI-BRAND SMARTPHONES &amp; ACCESSORIES</text>
  
  <!-- Glass Window & Display Area -->
  <rect x="200" y="240" width="480" height="270" rx="8" fill="#1E293B" stroke="#475569" stroke-width="3"/>
  <rect x="200" y="240" width="480" height="270" fill="url(#glowGrad)"/>
  
  <!-- Glass Shelves with phones -->
  <line x1="220" y1="320" x2="660" y2="320" stroke="#64748B" stroke-width="4"/>
  <line x1="220" y1="410" x2="660" y2="410" stroke="#64748B" stroke-width="4"/>
  
  <!-- Phone displays on shelves -->
  <rect x="250" y="260" width="30" height="50" rx="4" fill="#0284C7" stroke="#BAE6FD" stroke-width="1.5"/>
  <rect x="310" y="260" width="30" height="50" rx="4" fill="#6366F1" stroke="#E0E7FF" stroke-width="1.5"/>
  <rect x="370" y="260" width="30" height="50" rx="4" fill="#10B981" stroke="#D1FAE5" stroke-width="1.5"/>
  <rect x="430" y="260" width="30" height="50" rx="4" fill="#F59E0B" stroke="#FEF3C7" stroke-width="1.5"/>
  <rect x="490" y="260" width="30" height="50" rx="4" fill="#EC4899" stroke="#FCE7F3" stroke-width="1.5"/>
  <rect x="550" y="260" width="30" height="50" rx="4" fill="#3B82F6" stroke="#DBEAFE" stroke-width="1.5"/>
  
  <!-- Accessories below -->
  <rect x="250" y="350" width="45" height="50" rx="4" fill="#334155" stroke="#94A3B8" stroke-width="1"/>
  <text x="272" y="380" font-size="10" fill="#94A3B8" text-anchor="middle">GaN</text>
  <rect x="320" y="350" width="45" height="50" rx="4" fill="#334155" stroke="#94A3B8" stroke-width="1"/>
  <text x="342" y="380" font-size="10" fill="#94A3B8" text-anchor="middle">100W</text>
  <rect x="390" y="350" width="45" height="50" rx="4" fill="#334155" stroke="#94A3B8" stroke-width="1"/>
  <text x="412" y="380" font-size="10" fill="#94A3B8" text-anchor="middle">CASE</text>
  <rect x="460" y="350" width="45" height="50" rx="4" fill="#334155" stroke="#94A3B8" stroke-width="1"/>
  <text x="482" y="380" font-size="10" fill="#94A3B8" text-anchor="middle">GLASS</text>
  
  <!-- Entrance Door -->
  <rect x="710" y="240" width="310" height="270" rx="8" fill="#0F172A" stroke="#475569" stroke-width="3"/>
  <rect x="730" y="260" width="125" height="240" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <rect x="875" y="260" width="125" height="240" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <line x1="850" y1="360" x2="850" y2="400" stroke="#00D2FF" stroke-width="4" stroke-linecap="round"/>
  <line x1="880" y1="360" x2="880" y2="400" stroke="#00D2FF" stroke-width="4" stroke-linecap="round"/>
  <text x="865" y="490" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">WELCOME • OPEN DAILY</text>
</svg>

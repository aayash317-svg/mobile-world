<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Forgot Password • Mobile World Sales &amp; Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#0057c2",
            "primary-container": "#006ef2",
            "primary-fixed": "#d9e2ff",
            "on-primary": "#ffffff",
            surface: "#f9f9fe",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f3f3f9",
            "surface-container": "#ededf3",
            "surface-container-high": "#e8e8ed",
            "on-surface": "#1a1c20",
            "on-surface-variant": "#414755",
            outline: "#727786",
            "outline-variant": "#c1c6d7",
            tertiary: "#006b2f",
            "tertiary-fixed": "#95f8a7",
            error: "#ba1a1a",
            "error-container": "#ffdad6"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-on-surface font-sans min-h-screen flex flex-col justify-between">
  <header class="w-full bg-surface-container-lowest border-b border-surface-container-high py-3 px-4 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <img src="/static/images/shop/logo.png" alt="Mobile World Logo" class="h-8 w-auto object-contain"/>
        <div>
          <span class="font-bold text-sm tracking-tight text-on-surface block leading-none">Mobile World</span>
          <span class="text-[10px] text-on-surface-variant leading-none">Sales &amp; Service • Tamil Nadu</span>
        </div>
      </a>
      <a href="/signin" class="text-xs text-primary font-medium hover:underline flex items-center gap-1">
        <span class="material-symbols-outlined text-[16px]">login</span> Sign In
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-md border border-surface-container-high p-6 sm:p-8">
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-full bg-primary-fixed text-primary mx-auto flex items-center justify-center mb-3">
          <span class="material-symbols-outlined text-2xl">lock_reset</span>
        </div>
        <h1 class="text-2xl font-bold text-on-surface tracking-tight">Recover Password</h1>
        <p class="text-sm text-on-surface-variant mt-1">Enter your registered email address to receive password recovery instructions</p>
      </div>

      <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-sm flex items-start gap-2"></div>

      <form id="forgot-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1" for="email">
            Registered Email Address
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3 text-outline text-[20px]">mail</span>
            <input 
              type="email" 
              id="email" 
              required 
              placeholder="senthil@gmail.com"
              class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-surface-container-low border border-outline-variant focus:border-primary focus:bg-white text-on-surface text-sm transition-all focus:outline-none"
            />
          </div>
        </div>

        <button 
          type="submit" 
          id="submit-btn" 
          class="w-full py-3 px-4 rounded-xl bg-primary text-on-primary font-semibold text-sm hover:bg-primary-container active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-md shadow-primary/20"
        >
          <span id="btn-text">Send Password Reset Link</span>
          <span class="material-symbols-outlined text-[18px]">send</span>
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-surface-container-high text-center">
        <a href="/signin" class="text-xs text-primary font-semibold hover:underline flex items-center justify-center gap-1">
          <span class="material-symbols-outlined text-[16px]">arrow_back</span> Return to Sign In
        </a>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-on-surface-variant">
    &copy; 2026 Mobile World Sales &amp; Service • Gandhipuram, Coimbatore, Tamil Nadu
  </footer>

  <script>
    const form = document.getElementById('forgot-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      submitBtn.disabled = true;
      btnText.textContent = "Sending instructions...";

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        submitBtn.disabled = false;
        btnText.textContent = "Send Password Reset Link";

        alertBox.className = 'mb-4 p-3 rounded-xl text-sm flex items-start gap-2 bg-tertiary-fixed/40 text-tertiary border border-tertiary/20';
        alertBox.innerHTML = `
          <span class="material-symbols-outlined text-[18px] shrink-0 mt-0.5">check_circle</span>
          <div>${data.message || 'If this email is registered, instructions have been sent.'}</div>
        `;
        alertBox.classList.remove('hidden');
      } catch (err) {
        submitBtn.disabled = false;
        btnText.textContent = "Send Password Reset Link";
        alertBox.className = 'mb-4 p-3 rounded-xl text-sm flex items-start gap-2 bg-error-container text-error border border-error/20';
        alertBox.innerHTML = `
          <span class="material-symbols-outlined text-[18px] shrink-0 mt-0.5">error</span>
          <div>Unable to process request. Please check your connection.</div>
        `;
        alertBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login | Mobile World Sales &amp; Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/static/images/shop/logo.png">
  <style>
    :root {
      --primary: #0066ff;
      --primary-hover: #0052cc;
      --dark: #0f172a;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top right, #1e293b, #0f172a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-main);
    }
    .login-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      max-width: 420px;
      width: 100%;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin-bottom: 12px;
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--dark);
    }
    .login-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
    }
    .login-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .login-btn:hover {
      background: var(--primary-hover);
    }
    .alert-error {
      background: #fee2e2;
      color: #dc2626;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }
    .demo-credentials {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 12px;
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .demo-credentials strong {
      color: var(--dark);
    }
    .back-store {
      text-align: center;
      margin-top: 18px;
    }
    .back-store a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand">
      <img src="/static/images/shop/logo.png" alt="Mobile World" class="brand-logo" />
      <h2 class="login-title">Owner Dashboard</h2>
      <p class="login-sub">Mobile World Sales &amp; Service Portal</p>
    </div>

    <div id="errorAlert" class="alert-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-control" value="admin" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" value="admin123" required />
      </div>

      <button type="submit" id="loginBtn" class="login-btn">Sign In to Dashboard</button>
    </form>

    <div class="demo-credentials">
      <span style="font-weight: 700; color: #0066ff;">🔑 Demo Owner Credentials:</span><br>
      Username: <strong>admin</strong> | Password: <strong>admin123</strong>
    </div>

    <div class="back-store">
      <a href="/">← Return to Customer Storefront</a>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const errBox = document.getElementById("errorAlert");
      btn.disabled = true;
      btn.textContent = "Verifying...";
      errBox.style.display = "none";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Login failed");
        }
        window.location.href = data.redirect || "/admin/";
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In to Dashboard";
      }
    });
  </script>
</body>
</html>
